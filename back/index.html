<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnglishLearningApp</title>
    <script>
      function toggleType() {
        const categorySelect = document.querySelector(
          "select[name='category']"
        );
        const fileInput = document.querySelector("input[name='file']");

        if (document.getElementById("assets").checked) {
          fileInput.removeAttribute("required");
          fileInput.disabled = true;
        } else {
          fileInput.setAttribute("required", "true");
          fileInput.disabled = false;
        }

        categorySelect.disabled = !document.getElementById("data").checked;
      }
    </script>
  </head>
  <body>
    <h1>학습 데이터 업데이트</h1>
    <form action="/upload-excel" method="post" enctype="multipart/form-data">
      <label for="file">Excel File:</label>
      <input type="file" name="file" accept=".xlsx" required /><br /><br />

      <label>Type:</label><br />
      <input
        type="radio"
        id="category"
        name="type"
        value="0"
        checked
        onclick="toggleType()"
      />
      <label for="category">Category</label><br />
      <input
        type="radio"
        id="chapter"
        name="type"
        value="1"
        onclick="toggleType()"
      />
      <label for="chapter">Chapter</label><br />
      <input
        type="radio"
        id="data"
        name="type"
        value="2"
        onclick="toggleType()"
      />
      <label for="data">Data</label><br />
      <input
        type="radio"
        id="assets"
        name="type"
        value="3"
        onclick="toggleType()"
      />
      <label for="assets">Assets</label><br /><br />

      <label for="version">Version:</label>
      <input type="text" name="version" required /><br /><br />

      <label for="category">Category:</label>
      <select name="category" disabled required>
        <optgroup label="SENTENCES">
          <option value="5">5. 묻고 답하기 130선</option>
          <option value="4">4. 핵심패턴영어 250선</option>
          <option value="1">1. 미국인이 자주 쓰는 500선</option>
          <option value="10">10. 긴 문장 만들기 2500선</option>
          <option value="9">9. 이디엄 300선</option>
        </optgroup>
        <optgroup label="SITUATION">
          <option value="0">0. 나의 하루 일상 300선</option>
          <option value="3">3. 해외여행 필수문장 500선</option>
          <option value="2">2. 미국 드라마 표현 600선</option>
        </optgroup>
        <optgroup label="WORD">
          <option value="11">11. 기초단어 800선</option>
          <option value="6">6. 기초단어 활용문장 800선</option>
          <option value="13">13. 중급단어 900선</option>
          <option value="7">7. 중급단어 활용문장 900선</option>
          <option value="14">14. 고급단어 1100선</option>
          <option value="8">8. 고급단어 활용문장 1100선</option>
          <option value="12">12. 주제별 기초단어 190선</option>
        </optgroup>
        <optgroup label="PRONUNCIATION">
          <option value="15">15. 의문사 연음 발음</option>
          <option value="16">16. 조동사 연음 발음</option>
        </optgroup>
        <optgroup label="Q&A 100">
          <option value="17">17. 100문 100답 (기초)</option>
        </optgroup></select
      ><br /><br />
      <button type="submit">Upload</button>
    </form>
  </body>
</html>
